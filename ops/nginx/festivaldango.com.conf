# Production configuration for festivaldango.com (nginx 1.24).
# Install only after dist/ has been published, including 404.html.
server {
    server_name festivaldango.com www.festivaldango.com;
    root /var/www/dango;
    index index.html;

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/festivaldango.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/festivaldango.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.festivaldango.com) {
        return 301 https://festivaldango.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/ld+json application/xml text/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Astro and generated media filenames contain a content hash.
    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Non-hashed original assets must revalidate more frequently.
    location ~* \.(?:woff2?|ttf|otf|svg|webp|png|jpe?g|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name festivaldango.com www.festivaldango.com;
    return 301 https://festivaldango.com$request_uri;
}
